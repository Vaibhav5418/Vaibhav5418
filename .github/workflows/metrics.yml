# Self-hosted GitHub metrics — runs in YOUR repo, on YOUR schedule,
# using YOUR token, so it never depends on a shared/rate-limited public API.
# Full reference: https://github.com/lowlighter/metrics

name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]   # regenerates once a day
  workflow_dispatch:                  # lets you trigger it manually from the Actions tab
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg

          template: terminal
          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_threshold: 2%

          plugin_isocalendar: yes
          plugin_achievements: yes
          plugin_achievements_display: compact

          config_timezone: Asia/Kolkata
